<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#0a0a0c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Akano — Control Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="loginView" class="login-wrap hidden">
  <div class="login-card">
    <div class="login-badge-wrap">
      <div class="login-faceid-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
    </div>

    <h1 class="login-title">Akano <span>Console</span></h1>
    <p class="login-sub">Enter access key to continue</p>

    <form id="loginForm" novalidate>
      <div class="login-field">
        <svg class="login-field-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="loginKey" placeholder="Access key" autocomplete="current-password" required spellcheck="false" aria-label="Access key" />
        <button type="button" id="toggleLoginKey" class="login-eye-btn" aria-label="Toggle password visibility" tabindex="-1">
          <svg class="eye-icon eye-off" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          <svg class="eye-icon eye-on hidden" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <button type="submit" id="loginBtn" class="login-btn">
        <span class="btn-label">Unlock Console</span>
        <svg class="btn-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        <span class="btn-spinner hidden" aria-hidden="true"></span>
      </button>

      <p id="loginError" class="login-error hidden" role="alert"></p>
    </form>

    <div id="discordLoginWrap" class="hidden">
      <div class="login-divider"><span>or</span></div>
      <button type="button" id="discordLoginBtn" class="login-discord-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.06.06 0 0 0-.031-.03ZM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418Zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418Z"/></svg>
        <span>Continue with Discord</span>
      </button>
    </div>

    <div class="login-foot">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>Encrypted Session · Local-First Security</span>
    </div>
  </div>
</div>

<div id="appView" class="app hidden">
  <aside class="sidebar" id="sidebar" aria-label="Primary">
    <div class="drawer-handle" aria-hidden="true"></div>
    <div class="side-brand">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span class="brand-name">Akano</span>
      <span class="brand-sub">Console</span>
    </div>

    <div class="side-search-wrap">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="topSearch" type="search" placeholder="Search…" autocomplete="off" spellcheck="false" />
      <span class="search-kbd">/</span>
    </div>

    <nav class="side-nav" id="nav"></nav>
    <div class="side-foot">
      <button id="logoutBtn" class="ghost-btn small">Sign out</button>
    </div>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <main class="main">
    <header class="topbar">
      <div class="topbar__left">
        <button id="menuBtn" class="menu-btn" aria-label="Toggle menu" aria-expanded="false" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line class="bar b1" x1="4" y1="7" x2="20" y2="7"/>
            <line class="bar b2" x1="4" y1="12" x2="20" y2="12"/>
            <line class="bar b3" x1="4" y1="17" x2="20" y2="17"/>
          </svg>
        </button>
        <div class="top-title"><span id="pageTitle">Overview</span><span class="top-crumb" id="pageCrumb">console</span></div>
      </div>
      <div class="topbar__actions">
        <div class="notif-wrap">
          <button id="bellBtn" class="bell-btn" aria-label="Notifications" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span id="bellBadge" class="hidden"></span>
          </button>
          <div id="notifPanel" class="notif-panel hidden"><div class="np-head">Recent alerts</div><div id="notifList" class="np-list"></div></div>
        </div>
        <div class="status-pill" id="connPill"><span class="dot"></span><span id="connText">connecting…</span></div>
      </div>
    </header>

    <section class="content" id="content"></section>
  </main>
</div>

<div id="modalContainer"></div>
<div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

<script src="/app.js"></script>
</body>
</html>
