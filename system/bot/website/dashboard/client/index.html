<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Akano — Owner Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>


<div class="ios-bg-mesh" aria-hidden="true">
  <div class="mesh-orb mesh-1"></div>
  <div class="mesh-orb mesh-2"></div>
  <div class="mesh-orb mesh-3"></div>
</div>

<div id="loginView" class="login-wrap hidden">

  <div class="login-mesh-glow login-glow-1" aria-hidden="true"></div>
  <div class="login-mesh-glow login-glow-2" aria-hidden="true"></div>
  <div class="login-mesh-glow login-glow-3" aria-hidden="true"></div>

  <div class="login-card">
    <div class="login-card-sheen" aria-hidden="true"></div>


    <div class="login-badge-wrap">
      <div class="login-faceid-icon">
        <div class="faceid-glow"></div>
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 3H5a2 2 0 0 0-2 2v2M17 3h2a2 2 0 0 1 2 2v2M7 21H5a2 2 0 0 1-2-2v-2M17 21h2a2 2 0 0 0 2-2v-2M9 9h.01M15 9h.01M10 13c.5.5 1.5.5 2 0M10 17c.5.5 3.5.5 4 0"/>
        </svg>
      </div>
    </div>

    <h1 class="login-title">Akano <span>Console</span></h1>
    <p class="login-sub">Cupertino Security · Enter access key to continue</p>

    <form id="loginForm" novalidate>
      <div class="login-field">
        <svg class="login-field-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2.5"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><circle cx="12" cy="16" r="1.2"/></svg>
        <input type="password" id="loginKey" placeholder="Access key" autocomplete="current-password" required spellcheck="false" aria-label="Access key" />
        <button type="button" id="toggleLoginKey" class="login-eye-btn" aria-label="Toggle password visibility" tabindex="-1">
          <svg class="eye-icon eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          <svg class="eye-icon eye-on hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <button type="submit" id="loginBtn" class="login-btn">
        <span class="btn-sheen" aria-hidden="true"></span>
        <span class="btn-label">Unlock Console</span>
        <svg class="btn-arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        <span class="btn-spinner hidden" aria-hidden="true"></span>
      </button>

      <p id="loginError" class="login-error hidden" role="alert"></p>
    </form>

    <div class="login-foot">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>End-to-End Encrypted · Local-first · 12h Session</span>
    </div>
  </div>
</div>

<div id="appView" class="app hidden">
  <aside class="sidebar" id="sidebar" aria-label="Primary">
    <div class="drawer-handle" aria-hidden="true"></div>
    <div class="side-brand">
      <span class="brand-mark" aria-hidden="true">A—</span>
      <span class="brand-name">Akano</span>
      <span class="brand-sub">Console</span>
    </div>
    <nav class="side-nav" id="nav"></nav>
    <div class="side-foot">
      <button id="logoutBtn" class="ghost-btn small">Sign out</button>
    </div>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <main class="main">
    <header class="topbar">
      <div class="topbar__left">
        <button id="menuBtn" class="menu-btn" aria-label="Toggle menu" aria-expanded="false" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <line class="bar b1" x1="4" y1="7" x2="20" y2="7"/>
            <line class="bar b2" x1="4" y1="12" x2="20" y2="12"/>
            <line class="bar b3" x1="4" y1="17" x2="20" y2="17"/>
          </svg>
        </button>
        <div class="top-title"><span id="pageTitle">Overview</span><span class="top-crumb" id="pageCrumb">console</span></div>
      </div>
      <div class="topbar__actions">
        <label class="search-wrap" aria-label="Search">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="topSearch" type="search" placeholder="Search…" autocomplete="off" spellcheck="false" />
        </label>
        <div class="notif-wrap">
          <button id="bellBtn" class="bell-btn" aria-label="Notifications" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span id="bellBadge" class="hidden"></span>
          </button>
          <div id="notifPanel" class="notif-panel hidden"><div class="np-head">Recent alerts</div><div id="notifList" class="np-list"></div></div>
        </div>
        <div class="status-pill" id="connPill"><span class="dot"></span><span id="connText">connecting…</span></div>
      </div>
    </header>

    <section class="content" id="content"></section>
  </main>
</div>

<div id="modalContainer"></div>
<div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

<script src="/app.js"></script>
</body>
</html>
